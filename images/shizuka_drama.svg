<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="shizukaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3e3"/>
      <stop offset="50%" stop-color="#fae3c3"/>
      <stop offset="100%" stop-color="#eed0a4"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#shizukaBg)"/>

  <!-- カメラレンズ・写真館モチーフ -->
  <circle cx="150" cy="185" r="95" fill="none" stroke="#d49c5e" stroke-width="2" opacity="0.3"/>
  <circle cx="150" cy="185" r="60" fill="#f7ead7" stroke="#b87835" stroke-width="1.5"/>

  <!-- バッジ -->
  <rect x="105" y="36" width="90" height="22" fill="#ab5a2b" rx="11"/>
  <text x="150" y="51" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">📺 NHKドラマ</text>

  <!-- タイトル -->
  <text x="150" y="115" font-family="'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif" font-size="22" font-weight="bold" fill="#4a2e1b" text-anchor="middle">しずかちゃんと</text>
  <text x="150" y="145" font-family="'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif" font-size="30" font-weight="bold" fill="#ab5a2b" text-anchor="middle">パパ</text>

  <!-- カメラアイコン -->
  <text x="150" y="195" font-size="28" text-anchor="middle">📷</text>

  <!-- キャッチコピー -->
  <text x="150" y="270" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" fill="#66462c" text-anchor="middle">父と娘の、笑って泣ける</text>
  <text x="150" y="290" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" font-weight="bold" fill="#4a2e1b" text-anchor="middle">あたたかな日常と手話</text>

  <!-- 出演者 -->
  <rect x="60" y="315" width="180" height="40" fill="rgba(255,255,255,0.7)" rx="6" stroke="#d5b085" stroke-width="1"/>
  <text x="150" y="339" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" font-weight="bold" fill="#3a2212" text-anchor="middle">吉岡 里帆 ／ 笑福亭 鶴瓶</text>
</svg>

