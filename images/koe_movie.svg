<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="koeMovieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e7d9e"/>
      <stop offset="50%" stop-color="#76a8c7"/>
      <stop offset="100%" stop-color="#cbe3f0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#koeMovieBg)"/>

  <!-- 桜の花びら -->
  <circle cx="60" cy="80" r="4" fill="#ffd5df" opacity="0.8"/>
  <circle cx="240" cy="120" r="5" fill="#ffd5df" opacity="0.7"/>
  <circle cx="100" cy="300" r="4.5" fill="#ffd5df" opacity="0.85"/>
  <circle cx="210" cy="270" r="3.5" fill="#ffd5df" opacity="0.75"/>

  <!-- バッジ -->
  <rect x="95" y="32" width="110" height="22" fill="rgba(255,255,255,0.3)" rx="11" stroke="#ffffff" stroke-width="1"/>
  <text x="150" y="47" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">京都アニメーション</text>

  <!-- タイトル -->
  <text x="150" y="145" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">聲の形</text>
  <text x="150" y="172" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#e8f3fa" text-anchor="middle" letter-spacing="3">THE SHAPE OF VOICE</text>

  <line x1="70" y1="190" x2="230" y2="190" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- コピー -->
  <text x="150" y="224" font-family="'Hiragino Mincho ProN', serif" font-size="12" fill="#ffffff" text-anchor="middle">映画『聲の形』</text>

  <!-- スタッフ枠 -->
  <rect x="60" y="250" width="180" height="58" fill="rgba(255,255,255,0.25)" rx="8" backdrop-filter="blur(4px)"/>
  <text x="150" y="274" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" font-weight="bold" fill="#1b384d" text-anchor="middle">監督：山田 尚子</text>
  <text x="150" y="294" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#2d4f68" text-anchor="middle">脚本：吉田 玲子</text>

  <!-- フッター -->
  <text x="150" y="355" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#234259" text-anchor="middle">ポニーキャニオン</text>
</svg>

