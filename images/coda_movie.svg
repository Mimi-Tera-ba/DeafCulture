<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="codaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3b5a"/>
      <stop offset="50%" stop-color="#2a5278"/>
      <stop offset="100%" stop-color="#122538"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6c27a"/>
      <stop offset="50%" stop-color="#fdf3cc"/>
      <stop offset="100%" stop-color="#dfb362"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#codaBg)"/>

  <!-- 光の輪 -->
  <circle cx="150" cy="190" r="100" fill="#467baf" opacity="0.25"/>

  <!-- アカデミー賞受賞マーク -->
  <g transform="translate(150, 42)">
    <text x="0" y="0" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" font-weight="bold" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">★ 第94回アカデミー賞® 作品賞受賞 ★</text>
  </g>

  <!-- 英語タイトル -->
  <text x="150" y="115" font-family="'Times New Roman', serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">CODA</text>
  
  <!-- 日本語タイトル -->
  <text x="150" y="150" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="22" font-weight="bold" fill="url(#goldText)" text-anchor="middle" letter-spacing="2">コーダ あいのうた</text>

  <line x1="70" y1="175" x2="230" y2="175" stroke="#7aa3cc" stroke-width="1.5" opacity="0.6"/>

  <!-- キャッチコピー -->
  <text x="150" y="210" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" fill="#e1ecf7" text-anchor="middle">家族の中で、ひとりだけ</text>
  <text x="150" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">“きこえる”少女の夢と決断</text>

  <!-- 音楽・手話モチーフ -->
  <g transform="translate(132, 255)">
    <!-- 音符とハート -->
    <circle cx="18" cy="18" r="22" fill="rgba(255,255,255,0.1)"/>
    <text x="18" y="24" font-size="18" text-anchor="middle">🎵</text>
  </g>

  <!-- 出演者 -->
  <text x="150" y="325" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#bad3eb" text-anchor="middle">エミリア・ジョーンズ ／ トロイ・コッツァー</text>

  <!-- フッター -->
  <text x="150" y="365" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GAGA</text>
</svg>

