<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="koeBookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f2ece1"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#koeBookBg)"/>

  <!-- 背表紙 -->
  <rect x="0" y="0" width="16" height="400" fill="#e0d4c3"/>

  <!-- 外枠 -->
  <rect x="28" y="24" width="250" height="352" fill="none" stroke="#2b3b4c" stroke-width="2"/>

  <!-- バッジ -->
  <rect x="44" y="40" width="80" height="20" fill="#3b5998" rx="4"/>
  <text x="84" y="54" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">コミック全7巻</text>

  <!-- タイトル -->
  <text x="153" y="140" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="38" font-weight="bold" fill="#243342" text-anchor="middle" letter-spacing="4">聲の形</text>

  <line x1="80" y1="170" x2="226" y2="170" stroke="#c0a98f" stroke-width="1.5"/>

  <!-- キャッチコピー -->
  <text x="153" y="205" font-family="'Hiragino Mincho ProN', serif" font-size="12" fill="#586776" text-anchor="middle">伝えたい「こえ」がある。</text>
  <text x="153" y="228" font-family="'Hiragino Mincho ProN', serif" font-size="12" fill="#586776" text-anchor="middle">聞きたい「こえ」がある。</text>

  <!-- ノート・ペンモチーフ -->
  <g transform="translate(133, 255)">
    <rect x="0" y="0" width="40" height="32" fill="#ffffff" stroke="#c0a98f" stroke-width="1.5" rx="3"/>
    <line x1="8" y1="10" x2="32" y2="10" stroke="#c0a98f" stroke-width="1"/>
    <line x1="8" y1="16" x2="32" y2="16" stroke="#c0a98f" stroke-width="1"/>
    <line x1="8" y1="22" x2="24" y2="22" stroke="#c0a98f" stroke-width="1"/>
  </g>

  <!-- 著者・出版社 -->
  <text x="153" y="325" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="15" font-weight="bold" fill="#243342" text-anchor="middle">大今 良時</text>
  <text x="153" y="350" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#7a8b99" text-anchor="middle">週刊少年マガジンKC</text>
</svg>

