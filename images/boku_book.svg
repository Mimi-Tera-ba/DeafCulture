<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ede3d5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#bookBg)"/>
  
  <!-- 背表紙のライン -->
  <rect x="0" y="0" width="18" height="400" fill="#d9cbba"/>
  <line x1="18" y1="0" x2="18" y2="400" stroke="#bfaea0" stroke-width="1.5"/>
  
  <!-- 装飾フレーム -->
  <rect x="32" y="24" width="244" height="352" fill="none" stroke="#b08b64" stroke-width="2" rx="4"/>
  <rect x="36" y="28" width="236" height="344" fill="none" stroke="#d5c0ab" stroke-width="1" rx="2"/>

  <!-- バッジ -->
  <rect x="52" y="44" width="76" height="22" fill="#507753" rx="11"/>
  <text x="90" y="59" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">原作本</text>

  <!-- タイトル -->
  <text x="154" y="115" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="20" font-weight="bold" fill="#382c24" text-anchor="middle">ぼくが生きてる、</text>
  <text x="154" y="145" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="20" font-weight="bold" fill="#382c24" text-anchor="middle">ふたつの世界</text>
  
  <line x1="80" y1="170" x2="228" y2="170" stroke="#b08b64" stroke-width="1.5"/>
  
  <!-- サブコピー -->
  <text x="154" y="195" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#7a6857" text-anchor="middle">きこえる世界と</text>
  <text x="154" y="214" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#7a6857" text-anchor="middle">きこえない世界をつなぐ</text>

  <!-- アイコン装飾 -->
  <g transform="translate(130, 245)">
    <circle cx="24" cy="24" r="28" fill="#f5ede3" stroke="#d5c0ab" stroke-width="1"/>
    <!-- 手話・手のモチーフ -->
    <path d="M16,30 Q24,14 32,30" fill="none" stroke="#a65b32" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="18" r="4" fill="#a65b32"/>
  </g>

  <!-- 著者・出版社 -->
  <text x="154" y="325" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" font-weight="bold" fill="#4a3b30" text-anchor="middle">五十嵐 大</text>
  <text x="154" y="350" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#8c7867" text-anchor="middle">幻冬舎文庫</text>
</svg>

