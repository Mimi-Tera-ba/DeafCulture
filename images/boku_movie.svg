<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="movieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3022"/>
      <stop offset="50%" stop-color="#6e4632"/>
      <stop offset="100%" stop-color="#2d1c14"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#movieBg)"/>

  <!-- 光のグラデーション演出 -->
  <circle cx="150" cy="180" r="120" fill="#a65b32" opacity="0.35"/>
  <circle cx="150" cy="180" r="70" fill="#e89868" opacity="0.2"/>

  <!-- 映画バッジ -->
  <rect x="110" y="32" width="80" height="22" fill="#ab5a2b" rx="11"/>
  <text x="150" y="47" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">🎬 劇場映画</text>

  <!-- タイトル -->
  <text x="150" y="115" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ぼくが生きてる、</text>
  <text x="150" y="148" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ふたつの世界</text>

  <line x1="70" y1="172" x2="230" y2="172" stroke="#e8a87c" stroke-width="1.5" opacity="0.8"/>

  <!-- キャスト・監督 -->
  <text x="150" y="206" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" font-weight="bold" fill="#fbeee4" text-anchor="middle">吉沢 亮</text>
  <text x="150" y="228" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" fill="#e8cfbd" text-anchor="middle">忍足 亜希子</text>

  <rect x="70" y="252" width="160" height="44" fill="rgba(0,0,0,0.3)" rx="8" stroke="#8c614b" stroke-width="1"/>
  <text x="150" y="271" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#e8cfbd" text-anchor="middle">監督：呉 美保</text>
  <text x="150" y="287" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" fill="#c2a28d" text-anchor="middle">原作：五十嵐 大</text>

  <!-- フッター表記 -->
  <text x="150" y="345" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" fill="#d5b6a3" text-anchor="middle">UDCast対応作品</text>
  <text x="150" y="365" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GAGA</text>
</svg>

