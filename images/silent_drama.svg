<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="silentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5d6e"/>
      <stop offset="50%" stop-color="#6b8296"/>
      <stop offset="100%" stop-color="#344350"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#silentBg)"/>

  <!-- 雪・静けさのパーティクル -->
  <circle cx="50" cy="70" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="230" cy="90" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="280" r="3" fill="#ffffff" opacity="0.35"/>
  <circle cx="250" cy="310" r="2.5" fill="#ffffff" opacity="0.5"/>

  <!-- ドラマバッジ -->
  <rect x="105" y="36" width="90" height="22" fill="rgba(255,255,255,0.2)" rx="11" stroke="#ffffff" stroke-width="1"/>
  <text x="150" y="51" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">📺 フジテレビ</text>

  <!-- タイトル -->
  <text x="150" y="145" font-family="'Helvetica Neue', 'Hiragino Mincho ProN', serif" font-size="46" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="6">silent</text>
  
  <line x1="80" y1="175" x2="220" y2="175" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <!-- キャッチコピー -->
  <text x="150" y="210" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="13" fill="#e8f0f6" text-anchor="middle">音のない世界で、</text>
  <text x="150" y="234" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="13" fill="#e8f0f6" text-anchor="middle">再び巡り会ったふたりの物語</text>

  <!-- キャスト -->
  <rect x="60" y="270" width="180" height="52" fill="rgba(0,0,0,0.25)" rx="6"/>
  <text x="150" y="293" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">川口 春奈 ／ 目黒 蓮</text>
  <text x="150" y="311" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" fill="#bad1e6" text-anchor="middle">脚本：生方 美久</text>

  <!-- フッター -->
  <text x="150" y="365" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#bad1e6" text-anchor="middle">木曜劇場</text>
</svg>

