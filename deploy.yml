name: Deploy to Lolipop FTP (Deaf Culture Library)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data.js'
      - 'ogp.jpg'
      - 'images/**'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-deaf-culture
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy to Lolipop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_CULTURE_DIR || secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/*.bak*
            **/*.md
            **/scratch/**
            **/ANTIGRAVITY.md
            **/wp-banner-snippet.html

